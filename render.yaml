services:
  - type: web
    name: two-tier-llm-cache
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: qwen/qwen3.8-27b
      - key: PYTHON_VERSION
        value: 3.11.9
